<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitor Hayom</title>
    <style>
      :root {
        --bg: #edf1f5;
        --ink: #1f2430;
        --muted: #697586;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      .page-shell {
        width: 100%;
        margin: 0 auto;
        padding: 22px 18px 36px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 8px 18px;
        max-width: min(1500px, 100%);
        margin: 0 auto;
      }

      .brand-block {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 1.1rem;
      }

      .brand-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, #3a7bfd, #7c4dff);
        box-shadow: 0 0 0 4px rgba(58, 123, 253, 0.14);
      }

      .topbar-note {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .news-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(300px, 1fr));
        gap: 16px;
      }

      .site-card {
        width: 100%;
        height: 700px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 12px rgba(26, 35, 62, 0.08);
        background: white;
      }

      .site-iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: white;
      }

      @media (max-width: 1200px) {
        .news-grid { grid-template-columns: repeat(2, minmax(300px, 1fr)); }
      }

      @media (max-width: 680px) {
        .page-shell { padding: 16px 12px 30px; }
        .topbar {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
          padding: 0 4px 12px;
        }
        .news-grid { grid-template-columns: 1fr; }
        .site-card { height: 600px; }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-dot"></span>
          <span>Monitor Hayom</span>
        </div>
        <div class="topbar-note">גרסת מובייל • 4 אתרים</div>
      </header>

      <main class="news-grid" aria-label="Grid of mobile news homepages">
        <section class="site-card" aria-label="Walla mobile homepage">
          <iframe src="https://www.walla.co.il" class="site-iframe" title="Walla homepage"></iframe>
        </section>

        <section class="site-card" aria-label="Ynet mobile homepage">
          <iframe src="https://www.ynet.co.il" class="site-iframe" title="Ynet homepage"></iframe>
        </section>

        <section class="site-card" aria-label="Israel Hayom mobile homepage">
          <iframe src="https://www.israelhayom.co.il" class="site-iframe" title="Israel Hayom homepage"></iframe>
        </section>

        <section class="site-card" aria-label="N12 mobile homepage">
          <iframe src="https://www.n12.co.il" class="site-iframe" title="N12 homepage"></iframe>
        </section>
      </main>
    </div>
  </body>
</html>
